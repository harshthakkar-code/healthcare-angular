<app-doctor-breadcrumb></app-doctor-breadcrumb>

<div class="content doctor-content">
  <div class="container">
    <div class="row">
      <div class="col-lg-4 col-xl-3 theiaStickySidebar">
        <!-- Profile Sidebar -->
        <app-doctor-sidebar class="col-md-5 col-lg-4 col-xl-3"></app-doctor-sidebar>
        <!-- /Profile Sidebar -->
      </div>
      <div class="col-lg-8 col-xl-9">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3 class="fw-bold" style="font-size: 2rem; margin-bottom: 0;">Speciality & Services</h3>
          <button class="btn btn-primary rounded-pill px-4 py-2 fw-bold" style="background: #00b6ff; border: none; font-size: 1rem;" (click)="addSpecialization()">Add New Speciality</button>
        </div>
        <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
        <div *ngIf="loading">Loading...</div>
        <div *ngIf="newSpecialization" class="card shadow-sm border-0 mb-4" style="border-radius: 14px;">
          <div class="card-header bg-white d-flex justify-content-between align-items-center" style="border-radius: 14px 14px 0 0; border-bottom: 1px solid #eee;">
            <span class="fw-bold" style="font-size: 1.2rem;">{{ newSpecialization.name || 'Speciality' }}</span>
            <a href="javascript:void(0);" class="fw-bold" style="color: #ff0000; font-size: 1rem;" (click)="cancelNewSpecialization()">Delete </a>
          </div>
          <div class="card-body" style="background: #fff; border-radius: 0 0 14px 14px;">
            <div class="row mb-3">
              <div class="col-md-4">
                <label class="form-label fw-bold" style="color: #222;">Speciality <span class="text-danger">*</span></label>
                <mat-form-field appearance="fill" class="w-100">
                  <mat-select [(ngModel)]="newSpecialization.name">
                    <mat-option *ngFor="let option of specialityOptions" [value]="option">{{ option }}</mat-option>
                  </mat-select>
                </mat-form-field>
              </div>
            </div>
            <div *ngFor="let service of newSpecialization.services; let i = index" class="row align-items-end mb-2">
              <div class="col-md-3">
                <label class="form-label fw-bold" style="color: #222;">Service <span class="text-danger">*</span></label>
                <mat-form-field appearance="fill" class="w-100">
                  <mat-select [(ngModel)]="service.name">
                    <mat-option *ngFor="let option of serviceOptions" [value]="option">{{ option }}</mat-option>
                  </mat-select>
                </mat-form-field>
              </div>
              <div class="col-md-2">
                <label class="form-label fw-bold" style="color: #222;">Price ($) <span class="text-danger">*</span></label>
                <input [(ngModel)]="service.price" type="number" placeholder="454" class="form-control" style="background: #fafbfc; border-radius: 8px;" />
              </div>
              <div class="col-md-5">
                <label class="form-label fw-bold" style="color: #222;">About Service</label>
                <input [(ngModel)]="service.about" placeholder="" class="form-control" style="background: #fafbfc; border-radius: 8px;" />
              </div>
              <div class="col-md-2 d-flex align-items-center">
                <a href="javascript:void(0);" class="fw-bold ms-2" style="color: #ff0000; font-size: 1rem;" (click)="deleteNewServiceRow(i)">Delete</a>
              </div>
            </div>
            <div class="text-end mb-3">
              <a href="javascript:void(0);" class="fw-bold" style="color: #00b6ff; font-size: 1rem;" (click)="addNewServiceRow()">Add New Service</a>
            </div>
          </div>
        </div>
        <div *ngIf="newSpecialization" class="d-flex justify-content-end mb-4">
          <button class="btn btn-light rounded-pill px-4 py-2 me-2 fw-bold" style="background: #f1f2f6; color: #6c757d; font-size: 1rem;" (click)="cancelNewSpecialization()">Cancel</button>
          <button class="btn btn-primary rounded-pill px-4 py-2 fw-bold" style="background: #00b6ff; border: none; font-size: 1rem;" (click)="saveNewSpecialization()">Save Changes</button>
        </div>
        <div class="accordions" id="list-accord">
          <div *ngFor="let spec of specializations; let i = index" class="card shadow-sm border-0 mb-4 user-accordion-item" style="border-radius: 14px;">
            <a href="javascript:void(0);" class="accordion-wrap card-header bg-white d-flex justify-content-between align-items-center" style="border-radius: 14px 14px 0 0; border-bottom: 1px solid #eee; padding: 1.25rem 1.5rem;"
               data-bs-toggle="collapse"
               [attr.data-bs-target]="'#spec-' + spec._id">
              <span class="fw-bold" style="font-size: 1.2rem; color: #222;">{{ spec.name }}</span>
              <a href="javascript:void(0);" class="fw-bold" style="color: #ff0000; font-size: 1rem; padding-right: 30px;" (click)="$event.stopPropagation(); deleteSpecialization(spec)">Delete </a>
            </a>
            <div class="accordion-collapse collapse" [ngClass]="{'show': i === 0}"
                 [id]="'spec-' + spec._id"
                 [attr.data-bs-parent]="'#list-accord'">
              <div class="card-body" style="background: #fff; border-radius: 0 0 14px 14px;">
                <div class="row mb-3">
                  <div class="col-md-4">
                    <label class="form-label fw-bold" style="color: #222;">Speciality <span class="text-danger">*</span></label>
                    <mat-form-field appearance="fill" class="w-100">
                      <mat-select [(ngModel)]="spec.name" (ngModelChange)="onEditField(spec)">
                        <mat-option *ngFor="let option of specialityOptions" [value]="option">{{ option }}</mat-option>
                      </mat-select>
                    </mat-form-field>
                  </div>
                </div>
                <div *ngFor="let service of spec.services; let si2 = index" class="row align-items-end mb-2">
                  <div class="col-md-3">
                    <label class="form-label fw-bold" style="color: #222;">Service <span class="text-danger">*</span></label>
                    <mat-form-field appearance="fill" class="w-100">
                      <mat-select [(ngModel)]="service.name" (ngModelChange)="onEditField(spec)">
                        <mat-option *ngFor="let option of serviceOptions" [value]="option">{{ option }}</mat-option>
                      </mat-select>
                    </mat-form-field>
                  </div>
                  <div class="col-md-2">
                    <label class="form-label fw-bold" style="color: #222;">Price ($) <span class="text-danger">*</span></label>
                    <input [(ngModel)]="service.price" type="number" placeholder="454" class="form-control" style="background: #fafbfc; border-radius: 8px;" (ngModelChange)="onEditField(spec)" />
                  </div>
                  <div class="col-md-5">
                    <label class="form-label fw-bold" style="color: #222;">About Service</label>
                    <input [(ngModel)]="service.about" placeholder="About Service" class="form-control" style="background: #fafbfc; border-radius: 8px;" (ngModelChange)="onEditField(spec)" />
                  </div>
                  <div class="col-md-2 d-flex align-items-center">
                    <button class="btn btn-link fw-bold ms-2 p-0" style="color: #ff0000; font-size: 1rem;" (click)="deleteService(spec, service)">Delete</button>
                  </div>
                </div>
                <div class="text-end mb-3">
                  <a href="javascript:void(0);" class="fw-bold" style="color: #00b6ff; font-size: 1rem;" (click)="addService(spec)">Add New Service</a>
                </div>
                <div *ngIf="spec.editMode" class="d-flex justify-content-end mt-4">
                  <button class="btn btn-light rounded-pill px-4 py-2 me-2 fw-bold" style="background: #f1f2f6; color: #6c757d; font-size: 1rem;" (click)="cancelEditSpecialization(spec)">Cancel</button>
                  <button class="btn btn-primary rounded-pill px-4 py-2 fw-bold" style="background: #00b6ff; border: none; font-size: 1rem;" (click)="saveEditSpecialization(spec)">Save Changes</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
