<app-doctor-breadcrumb></app-doctor-breadcrumb>

<!-- Page Content -->
<div class="content doctor-content">
    <div class="container">
        <div class="row">
            <app-doctor-sidebar class="col-md-5 col-lg-4 col-xl-3"></app-doctor-sidebar>
            <div class="col-lg-8 col-xl-9">
                <div class="dashboard-header">
                    <h3>Change Password</h3>
                </div>
                <form (ngSubmit)="onSubmit()">
                    <div class="card pass-card">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="input-block input-block-new">
                                        <label class="form-label" for="old">Old Password</label>
                                        <div class="pass-group">
                                            <input [type]="password[0] ? 'text' : 'password' " class="form-control" [(ngModel)]="oldPassword" name="oldPassword" required>
                                            <span class="toggle-password feather"
                                                [ngClass]=" password[0] ? 'feather-eye' : 'feather-eye-off'"
                                                (click)="togglePassword(0)" (keydown)="togglePassword(0)" tabindex="1"></span>
                                        </div>
                                        <div *ngIf="oldPasswordError" class="text-danger small">{{ oldPasswordError }}</div>
                                    </div>
                                    <div class="input-block input-block-new">
                                        <label class="form-label" for="new">New Password</label>
                                        <div class="pass-group">
                                            <input [type]="password[1] ? 'text' : 'password' "
                                                class="form-control pass-input" [(ngModel)]="newPassword" name="newPassword" required>
                                            <span class="toggle-password feather"
                                                [ngClass]=" password[1] ? 'feather-eye' : 'feather-eye-off'"
                                                (click)="togglePassword(1)" (keydown)="togglePassword(1)" tabindex="1"></span>
                                        </div>
                                        <div *ngIf="newPasswordError" class="text-danger small">{{ newPasswordError }}</div>
                                    </div>
                                    <div class="input-block input-block-new mb-0">
                                        <label class="form-label" for="password">Confirm Password</label>
                                        <div class="pass-group">
                                            <input [type]="password[2] ? 'text' : 'password' "
                                                class="form-control pass-input-sub" [(ngModel)]="confirmPassword" name="confirmPassword" required>
                                            <span class="toggle-password feather"
                                                [ngClass]=" password[2] ? 'feather-eye' : 'feather-eye-off'"
                                                (click)="togglePassword(2)" (keydown)="togglePassword(2)" tabindex="1"></span>
                                        </div>
                                        <div *ngIf="confirmPasswordError" class="text-danger small">{{ confirmPasswordError }}</div>
                                        <div *ngIf="passwordMismatchError" class="text-danger small">{{ passwordMismatchError }}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="form-set-button">
                        <button class="btn btn-light" type="button">Cancel</button>
                        <button class="btn btn-primary" type="submit" [disabled]="loading">Save Changes</button>
                    </div>
                </form>
                <div *ngIf="successMessage" class="text-success small mt-2">{{ successMessage }}</div>
            </div>
        </div>
    </div>

</div>
<!-- /Page Content -->
