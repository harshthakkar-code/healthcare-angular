<div class="content login-page pt-0">
    <div class="container-fluid">
        
        <!-- Register Content -->
        <div class="account-content">
            <div class="d-flex align-items-center justify-content-center">
                <div class="login-right">
                    <div class="inner-right-login">
                        <div class="login-header">
                            <div class="logo-icon">
                                <img src="assets/img/logo.png" alt="doccure-logo">
                            </div>
                            <div class="step-list">
                                <ul>
                                    <li><a href="javascript:void(0)" class="active-done">1</a></li>
                                    <li><a href="javascript:void(0)" class="active-done">2</a></li>
                                    <li><a href="javascript:void(0)" class="active">3</a></li>
                                </ul>
                            </div>
                            <form (ngSubmit)="update()" #step3Form="ngForm">
                                <h3 class="my-4">Your Location</h3>
                                <div class="mb-3">
                                    <label class="form-label">City</label>
                                    <input type="text" class="form-control" name="city" [(ngModel)]="city">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">State</label>
                                    <input type="text" class="form-control" name="state" [(ngModel)]="state">
                                </div>
                                <button type="submit" class="btn btn-primary-gradient w-100">Update</button>
                            </form>
                        </div>
                    </div>
                    <div class="login-bottom-copyright">
                        <span>© 2023 Doccure. All rights reserved.</span>
                    </div>
                </div>
            </div>
        </div>
        <!-- /Register Content -->

    </div>

</div>
