<!-- Page Content -->
<div class="content top-space">
    <div class="container-fluid">
        
        <div class="row">
            <div class="col-md-8 offset-md-2">
							
                <!-- Login Tab Content -->
                <div class="account-content">
                    <div class="row align-items-center justify-content-center">
                        <div class="col-md-7 col-lg-6 login-left">
                            <img src="assets/img/login-banner.png" class="img-fluid" alt="Doccure Login">	
                        </div>
                        <div class="col-md-12 col-lg-6 login-right">
                            <div class="login-header">
                                <h3>Login <span>Doccure</span></h3>
                            </div>
                            <form #loginForm="ngForm" (ngSubmit)="login(loginForm)" autocomplete="off" novalidate>
                                <div class="mb-3">
                                    <label class="form-label">E-mail</label>
                                    <input type="email" [(ngModel)]="email" name="email" required email class="form-control" #emailCtrl="ngModel">
                                    <div *ngIf="isEmailInvalid(loginForm) && emailCtrl.errors?.['required']" class="text-danger" style="font-size:12px;">Please add email</div>
                                    <div *ngIf="isEmailInvalid(loginForm) && emailCtrl.errors?.['email']" class="text-danger" style="font-size:12px;">Please add valid email</div>
                                </div>
                                <div class="mb-3 form-check-box">
                                    <div class="form-group-flex">
                                        <!-- <div class="form-check mb-0">
                                            <input class="form-check-input" type="checkbox" id="remember" checked>
                                            <label class="form-check-label" for="remember">
                                                Remember Me  
                                            </label>
                                        </div>                                                 -->
                                        <div class="form-check mb-0">
                                            <input class="form-check-input" type="checkbox" id="otpLogin" [(ngModel)]="useOtp" name="useOtp" (change)="otpRequested = false; otp = ''; errorMessage = ''; otpMessage = ''">
                                            <label class="form-check-label" for="otpLogin">
                                                Login with OTP  
                                            </label>
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-3" *ngIf="!useOtp">
                                    <div class="form-group-flex">
                                        <label class="form-label">Password</label>
                                        <a [routerLink]="routes.forgotPassword" class="forgot-link">Forgot password?</a>
                                    </div>
                                    <div class="pass-group">
                                        <input [type]="togglePasswordClass ? 'text' : 'password'" [(ngModel)]="password" name="password" required class="form-control pass-input" #passwordCtrl="ngModel">
                                        <span class="toggle-password-sub" (click)="togglePassword()" (keydown)="togglePassword()" tabindex="1" [ngClass]="togglePasswordClass ? 'feather-eye' : 'feather-eye-off'"></span>
                                    </div>
                                    <div *ngIf="isPasswordInvalid(loginForm) && passwordCtrl.errors?.['required']" class="text-danger" style="font-size:12px;">Please add password</div>
                                    <div *ngIf="!useOtp && errorMessage" class="text-danger" style="font-size:12px;">{{ errorMessage }}</div>
                                </div>
                                <div class="mb-3" *ngIf="useOtp">
                                    <label class="form-label">OTP</label>
                                    <input type="text" [(ngModel)]="otp" name="otp" class="form-control" maxlength="6" *ngIf="otpRequested">
                                    <button class="btn btn-outline-primary w-100 mt-2" type="button" (click)="login(loginForm)" *ngIf="!otpRequested">Request OTP</button>
                                    <div *ngIf="otpMessage" style="color:green;">{{ otpMessage }}</div>
                                    <div *ngIf="useOtp && errorMessage" class="text-danger" style="font-size:12px;">{{ errorMessage }}</div>
                                </div>
                                <div class="mb-3">
                                    <button class="btn btn-primary-gradient w-100" type="submit" *ngIf="!useOtp || otpRequested">Sign in</button>
                                </div>
                                <div class="login-or">
                                    <span class="or-line"></span>
                                    <span class="span-or">or</span>
                                </div>
                                <div class="social-login-btn">
                                    <div id="g_id_onload"
                                         [attr.data-client_id]="googleClientId"
                                         data-context="signin"
                                         data-ux_mode="popup"
                                         data-callback="handleGoogleLogin"
                                         data-auto_prompt="false">
                                    </div>
                                    <div class="g_id_signin mb-2"
                                         data-type="standard"
                                         data-shape="rectangular"
                                         data-theme="outline"
                                         data-text="sign_in_with"
                                         data-size="large"
                                         data-logo_alignment="left">
                                    </div>
                                    <div *ngIf="googleError" class="text-danger" style="font-size:12px;">{{ googleError }}</div>
                                    <!-- <a href="javascript:void(0);" class="btn w-100 social-fb-btn">
                                        <img src="assets/img/icons/facebook-icon.svg" alt="fb-icon">Sign in With Facebook
                                    </a> -->
                                </div>
                                <div class="account-signup">
                                    <p>Don't have an account ? <a [routerLink]="routes.register">Sign up</a></p>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                <!-- /Login Tab Content -->
                    
            </div>
        </div>

    </div>

</div>		
<!-- /Page Content -->
