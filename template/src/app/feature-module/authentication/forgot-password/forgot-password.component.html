<div class="content top-space">
    <div class="container-fluid">
        
        <div class="row">
            <div class="col-md-8 offset-md-2">
                
                <!-- Account Content -->
                <div class="account-content">
                    <div class="row align-items-center justify-content-center">
                        <div class="col-md-7 col-lg-6 login-left">
                            <img src="assets/img/login-banner.png" class="img-fluid" alt="Login Banner">	
                        </div>
                        <div class="col-md-12 col-lg-6 login-right">
                            <div class="login-header">
                                <h3>Forgot Password?</h3>
                                <p>Enter your email and we will send you a link to reset your password.</p>
                            </div>
                            
                            <!-- Forgot Password Form -->
                            <form autocomplete="off">
                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" [(ngModel)]="email" name="email" [readonly]="otpRequested" required>
                                </div>
                                <div class="mb-3" *ngIf="!otpRequested">
                                    <button class="btn btn-primary w-100 btn-lg login-btn" type="button" (click)="requestOtp()">Request OTP</button>
                                </div>
                                <div class="mb-3" *ngIf="otpRequested && !otpVerified">
                                    <label class="form-label">Enter OTP</label>
                                    <input type="text" class="form-control" [(ngModel)]="otp" name="otp" maxlength="6" required>
                                    <button class="btn btn-primary w-100 btn-lg login-btn mt-2" type="button" (click)="verifyOtp()">Verify OTP</button>
                                </div>
                                <div *ngIf="otpMessage" style="color:green;">{{ otpMessage }}</div>
                                <div *ngIf="errorMessage" style="color:red;">{{ errorMessage }}</div>
                                <div class="account-signup">
                                    <p>Remember Password? <a [routerLink]="routes.userLogin">Sign In</a></p>
                                </div>
                            </form>
                            <!-- /Forgot Password Form -->
                            
                        </div>
                    </div>
                </div>
                <!-- /Account Content -->
                
            </div>
        </div>

    </div>

</div>
