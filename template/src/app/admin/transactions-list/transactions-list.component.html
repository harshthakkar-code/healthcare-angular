<!-- Page Wrapper -->
<div class="page-wrapper">
  <div class="content container-fluid">

    <!-- Page Header -->
    <div class="page-header">
      <div class="row">
        <div class="col-sm-12">
          <h3 class="page-title">Transactions</h3>
          <ul class="breadcrumb">
            <li class="breadcrumb-item"><a [routerLink] = "routes.adminDashboard">Dashboard</a></li>
            <li class="breadcrumb-item active">Transactions</li>
          </ul>
        </div>
      </div>
    </div>
    <!-- /Page Header -->

    <div class="row">
      <div class="col-sm-12">
        <div class="card">
          <div class="card-body">
            <div class="table-responsive">
              <app-pagination-header></app-pagination-header>
              <table matSort (matSortChange)="sortData($event)"  class="datatable table table-hover table-center mb-0">
                <thead>
                  <tr>
                    <th mat-sort-header="invoiceNumber">Invoice Number</th>
                    <th mat-sort-header="patientId">Patient ID</th>
                    <th mat-sort-header="patientName">Patient Name</th>
                    <th mat-sort-header="totalAmount">Total Amount</th>
                    <th mat-sort-header="status">Status</th>
                    <th mat-sort-header="actions">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let tx of transactions">
                    <td><a [routerLink]="routes.adminInvoice">{{tx._id}}</a></td>
                    <td>{{tx.appointment?.patient?._id}}</td>
                    <td>
                      <h2 class="table-avatar">
                        <a  style="cursor: default;" class="avatar avatar-sm me-2">
                          <img class="avatar-img rounded-circle" [src]="tx.appointment?.patient?.avatar || 'assets/img/patients/default.png'" alt="User Image">
                        </a>
                        <a  style="cursor: default;">{{tx.appointment?.patient?.name}}</a>
                      </h2>
                    </td>
                    <td>{{tx.amount}}</td>
                    <td>
                      <span class="badge rounded-pill bg-success inv-badge">{{tx.status}}</span>
                    </td>
                    <td>
                      <div class="actions">
                        <a class="btn btn-sm bg-danger-light" data-bs-toggle="modal" href="#delete_modal" (click)="openDeleteModal(tx)">
                          <i class="fe fe-trash"></i>
                        </a>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <app-custom-pagination></app-custom-pagination>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- /Page Wrapper -->
