<div class="page-wrapper">
  <div class="content container-fluid">

    <!-- Page Header -->
    <div class="page-header">
      <div class="row">
        <div class="col-sm-12">
          <h3 class="page-title">List of Doctors</h3>
          <ul class="breadcrumb">
            <li class="breadcrumb-item"><a [routerLink] = "routes.adminDashboard">Dashboard</a></li>
            <li class="breadcrumb-item"><a href="javascript:void(0)">Users</a></li>
            <li class="breadcrumb-item active">Doctor</li>
          </ul>
        </div>
      </div>
    </div>
    <!-- /Page Header -->

    <div class="row">
      <div class="col-sm-12">
        <div class="card">
          <div class="card-body">
            <div class="table-responsive">
              <div class="table-controls d-flex justify-content-between align-items-center mb-2">
                <app-pagination-header></app-pagination-header>
                <div class="status-filter ms-auto">
                  <select
                    class="form-select form-select-sm"
                    style="width: 130px; min-width: 100px;"
                    [(ngModel)]="statusFilter"
                    (change)="onStatusFilterChange()"
                    title="Filter by Status"
                  >
                    <option value="">All</option>
                    <option value="pending">Pending</option>
                    <option value="true">Approved</option>
                    <option value="false">Rejected</option>
                  </select>
                </div>
              </div>
              <table matSort (matSortChange)="sortData($event)" class="datatable table table-hover table-center mb-0">
                <thead>
                  <tr>
                    <th mat-sort-header="doctorName">Doctor Name</th>
                    <th mat-sort-header="speciality">Speciality</th>
                    <th mat-sort-header="memberSince">Member Since</th>
                    <th mat-sort-header="earned">Earned</th>
                    <th mat-sort-header="accountStatus">Account Status</th>
                  </tr>
                </thead>
                <tbody>
                  @for (data of tableData; track data; let i = $index) {
                    <tr>
                      <td>
                        <h2 class="table-avatar">
                          <a  style="cursor: default;" class="avatar avatar-sm me-2"><img class="avatar-img rounded-circle" [src]="data.img" alt="User Image"></a>
                          <a  style="cursor: default;">{{data.doctorName}}</a>
                        </h2>
                      </td>
                      <td>{{data.speciality}}</td>
                      <td>{{data.memberSince}} <br><small>{{data.time}}</small></td>
                      <td>{{data.earned}}</td>
                      <td>
                        <ng-container [ngSwitch]="data.isApproved">
                          <ng-container *ngSwitchCase="'pending'">
                            <div class="status-row">
                              <button type="button" class="text-success-icon btn btn-link p-0" (click)="approveDoctor(data)" [disabled]="isLoading">
                                <i class="fa-solid fa-check"></i>
                              </button>
                              <span class="status-badge pending">Pending</span>
                            </div>
                          </ng-container>
                          <ng-container *ngSwitchCase="'true'">
                            <div class="status-row">
                              <button type="button" class="text-danger-icon btn btn-link p-0" (click)="rejectDoctor(data)" [disabled]="isLoading">
                                <i class="fa-solid fa-xmark"></i>
                              </button>
                              <span class="status-badge approved">Approved</span>
                            </div>
                          </ng-container>
                          <ng-container *ngSwitchCase="'false'">
                            <div class="status-row">
                              <button type="button" class="text-success-icon btn btn-link p-0" (click)="approveDoctor(data)" [disabled]="isLoading">
                                <i class="fa-solid fa-check"></i>
                              </button>
                              <span class="status-badge rejected">Rejected</span>
                            </div>
                          </ng-container>
                        </ng-container>
                        <span *ngIf="isLoading" class="ms-2"><i class="fa fa-spinner fa-spin"></i></span>
                      </td>
                    </tr>
                  }
                </tbody>
              </table>
            </div>
            <app-custom-pagination></app-custom-pagination>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
